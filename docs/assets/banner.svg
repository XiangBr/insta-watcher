<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">insta-watcher</title>
  <desc id="desc">Automação de Instagram self-hosted: comentou a palavra-chave, recebeu o link no direct.</desc>
  <defs>
    <clipPath id="frame">
      <rect width="1280" height="420" rx="28"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#0f1630"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1f5eff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1f5eff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d63384" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d63384" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c9d6ff"/>
      <stop offset="1" stop-color="#ff9ec8"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b74ff"/>
      <stop offset="1" stop-color="#1f5eff"/>
    </linearGradient>
    <linearGradient id="dm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a5cff"/>
      <stop offset="1" stop-color="#c13584"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <circle cx="250" cy="90" r="320" fill="url(#glowBlue)"/>
    <circle cx="1060" cy="380" r="300" fill="url(#glowPink)"/>
  </g>

  <!-- logo + wordmark -->
  <g transform="translate(88 104)">
    <rect width="76" height="76" rx="20" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(14 14) scale(2)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/>
      <circle cx="12" cy="12" r="3"/>
    </g>
  </g>
  <text x="88" y="262" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="-3" fill="url(#word)">insta-watcher</text>
  <text x="92" y="312" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#aab6d8">Comentou a palavra, recebeu no direct. Self-hosted, do seu jeito.</text>

  <!-- feature chips -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#dfe6ff">
    <g transform="translate(92 344)">
      <rect width="170" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="85" y="25" text-anchor="middle">comentário → DM</text>
    </g>
    <g transform="translate(274 344)">
      <rect width="168" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="84" y="25" text-anchor="middle">fluxos no direct</text>
    </g>
    <g transform="translate(454 344)">
      <rect width="96" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="48" y="25" text-anchor="middle">I.A.</text>
    </g>
    <g transform="translate(562 344)">
      <rect width="112" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="56" y="25" text-anchor="middle">insights</text>
    </g>
    <g transform="translate(686 344)">
      <rect width="138" height="38" rx="19" fill="#1f5eff" fill-opacity="0.22" stroke="#5b8cff" stroke-opacity="0.6"/>
      <text x="69" y="25" text-anchor="middle" fill="#cfdcff">open source</text>
    </g>
  </g>

  <!-- phone -->
  <g transform="translate(930 46)" filter="url(#shadow)">
    <rect width="272" height="328" rx="38" fill="#0a0d16" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <rect x="106" y="14" width="60" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>

    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
      <!-- the comment -->
      <circle cx="40" cy="62" r="13" fill="#2a3150"/>
      <text x="62" y="58" font-size="12" font-weight="700" fill="#e8ecff">@fulana</text>
      <text x="62" y="76" font-size="14" fill="#c4cbe4">quero o <tspan font-weight="800" fill="#ffffff">LINK</tspan></text>

      <!-- arrow down -->
      <g stroke="#5b8cff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M136 98v30"/>
        <path d="M128 120l8 9 8-9"/>
      </g>

      <!-- the DM -->
      <rect x="24" y="146" width="224" height="118" rx="20" fill="url(#dm)"/>
      <text x="42" y="176" font-size="14" font-weight="600" fill="#ffffff">Oi fulana! Aqui está</text>
      <text x="42" y="196" font-size="14" font-weight="600" fill="#ffffff">o material que você pediu:</text>
      <rect x="42" y="212" width="188" height="36" rx="12" fill="#ffffff" fill-opacity="0.18"/>
      <text x="136" y="235" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Baixar agora</text>

      <!-- quick replies -->
      <rect x="96" y="278" width="72" height="28" rx="14" fill="none" stroke="#a78bfa" stroke-opacity="0.85"/>
      <text x="132" y="297" font-size="12" font-weight="600" fill="#ddd6fe" text-anchor="middle">Curso</text>
      <rect x="176" y="278" width="72" height="28" rx="14" fill="none" stroke="#a78bfa" stroke-opacity="0.85"/>
      <text x="212" y="297" font-size="12" font-weight="600" fill="#ddd6fe" text-anchor="middle">Falar</text>
    </g>
  </g>
</svg>
