# insta-watcher: API, dashboard and a small gateway, on any machine with Docker.
#
#   ./scripts/setup.sh          # asks a few questions, writes .env, starts everything
#   docker compose up -d --build
#
# Every setting comes from .env (see .env.example and docs/deploy.md). The same file serves
# every way of running it:
#
#   domain  the gateway answers on 80/443 of a server and gets the HTTPS certificate itself
#   proxy   you already have a reverse proxy (Nginx, Traefik, another Caddy): it forwards to
#           the gateway on a local port, and keeps doing the HTTPS
#   tunnel  no server, no domain: a Cloudflare tunnel gives a public HTTPS address to your own
#           machine (COMPOSE_PROFILES=web,tunnel), good for trying it out
#   vercel  the dashboard runs on Vercel and only api + gateway run here
#
# Only the gateway publishes ports. The API is reachable only through it, and its admin
# routes (/api/v1) are not reachable from outside at all unless ADMIN_API_HANDLER says so.

name: insta-watcher

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *default-logging

services:
  api:
    <<: *hardening
    build: ./backend
    image: insta-watcher-api:local
    env_file: [.env]
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      # The API publishes no port: whatever reaches it came through the gateway or the
      # dashboard, both on this private network, so their X-Forwarded-For is trusted.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [internal]
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 128

  web:
    <<: *hardening
    profiles: [web]
    build: ./frontend
    image: insta-watcher-web:local
    env_file: [.env]
    environment:
      API_BASE_URL: http://api:8000
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /app/.next/cache:size=64m,uid=10001
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    mem_limit: 384m
    pids_limit: 128

  gateway:
    <<: *hardening
    image: caddy:2-alpine
    environment:
      # A domain (insta.example.com) turns on automatic HTTPS. ":80" serves plain HTTP,
      # for a proxy or a tunnel in front.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ADMIN_API_HANDLER: ${ADMIN_API_HANDLER:-respond 404}
    ports:
      - "${HTTP_BIND:-127.0.0.1:8080}:80"
      - "${HTTPS_BIND:-127.0.0.1:8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16m
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      api:
        condition: service_healthy
    networks: [internal, edge]

  # Quick tunnel: a random https://*.trycloudflare.com address, new on every restart.
  # `./scripts/setup.sh` reads it from the logs. Good for testing, not for daily use.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate --url http://gateway:80
    restart: unless-stopped
    logging: *default-logging
    depends_on: [gateway]
    networks: [edge]

  # Named tunnel: a fixed hostname on your Cloudflare account (docs/deploy.md).
  named-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [named-tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    logging: *default-logging
    depends_on: [gateway]
    networks: [edge]

networks:
  # The API and the dashboard: no internet route needed from here in, but the API calls the
  # Meta, Apify and OpenRouter APIs, so this network is not marked internal.
  internal: {}
  edge: {}

volumes:
  # SQLite database: the encrypted token and the personal data. Back it up (docs/deploy.md).
  data:
    name: insta_watcher_data
  caddy_data:
  caddy_config:
